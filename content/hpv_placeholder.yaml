  - id: sys.emergency
    vaccine: hpv
    intent: emergency
    severity: emergency
    title: {en: "Urgent help", ur: "فوری مدد", ur_roman: "Fori madad"}
    text:
      en: "[PLACEHOLDER – not medical advice] This may need urgent medical care. Please go to the nearest hospital now or call Rescue 1122."
      ur: "[عارضی متن – طبی مشورہ نہیں] اس کے لیے فوری طبی امداد کی ضرورت ہو سکتی ہے۔ ابھی قریبی ہسپتال جائیں یا ریسکیو 1122 پر کال کریں۔"
      ur_roman: "[PLACEHOLDER – tibbi mashwara nahi] Is ke liye fori tibbi imdad ki zaroorat ho sakti hai. Abhi qareebi hospital jayein ya Rescue 1122 par call karein."
    question_variants: []
    related_units: []
    sources: []
