  - id: sys.out_of_scope
    vaccine: hpv
    intent: out_of_scope
    severity: normal
    title: {en: "Topics", ur: "موضوعات", ur_roman: "Topics"}
    text:
      en: "[PLACEHOLDER – not medical advice] Sorry, I can only answer questions about the HPV vaccine. Choose a topic below."
      ur: "[عارضی متن – طبی مشورہ نہیں] معذرت، میں صرف ایچ پی وی ویکسین کے بارے میں سوالات کا جواب دے سکتا ہوں۔ نیچے سے موضوع منتخب کریں۔"
      ur_roman: "[PLACEHOLDER – tibbi mashwara nahi] Maazrat, main sirf HPV vaccine ke baare mein sawalon ka jawab de sakta hoon. Neeche se topic chunein."
